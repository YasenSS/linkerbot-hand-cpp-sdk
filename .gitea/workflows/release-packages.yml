name: Release packages

# Generate and verify candidates; creating tags/Releases remains a separate action.
"on":
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      comm_sha:
        description: 'Full 40-character transport commit SHA'
        required: true
      expected_version:
        description: 'Version required in both source projects and packages'
        required: true
        default: '0.3.0'

env:
  COMM_REPO: ouyangshun/linkerbot-transport-cpp
  REQUESTED_COMM_SHA: ${{ inputs.comm_sha }}
  REQUESTED_VERSION: ${{ inputs.expected_version }}
  PYTHONUTF8: '1'

jobs:
  linux:
    name: Linux x86_64 / Release / TGZ
    if: github.event_name != 'push' || github.event.deleted != true
    # Register this label with an Ubuntu 24.04 x86_64 environment.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Install release tools
        run: |
          set -eu
          apt_get() { if [ "$(id -u)" -eq 0 ]; then apt-get "$@"; else sudo apt-get "$@"; fi; }
          apt_get update
          apt_get install -y --no-install-recommends gcc-13 g++-13 make cmake git ca-certificates python3
          test "$(uname -m)" = x86_64

      - name: Check out exact hand revision
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git_auth() { git -c "http.extraHeader=AUTHORIZATION: bearer ${TOKEN}" "$@"; }
          git_auth clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" hand-cpp
          git -C hand-cpp checkout --detach "$GITHUB_SHA"

      - name: Resolve tag or manual release inputs
        run: python3 hand-cpp/validation/resolve_release.py

      - name: Check out exact transport revision
        env:
          COMM_TOKEN: ${{ secrets.LINKERBOT_COMM_TOKEN || github.token }}
        run: |
          set -eu
          git -c "http.extraHeader=AUTHORIZATION: bearer ${COMM_TOKEN}" clone --no-checkout \
            "${GITHUB_SERVER_URL}/${COMM_REPO}.git" linkerbot-transport-cpp
          git -C linkerbot-transport-cpp checkout --detach "$COMM_SHA"

      - name: Build, audit TGZ and verify relocated consumers
        run: |
          set -eu
          release_work=$(mktemp -d "${RUNNER_TEMP}/sdk-release-linux-XXXXXX")
          printf 'RELEASE_WORK=%s\n' "$release_work" >> "$GITHUB_ENV"
          python3 hand-cpp/validation/run_release_validation.py \
            --comm-source linkerbot-transport-cpp --work-dir "$release_work" \
            --hand-sha "$HAND_SHA" --comm-sha "$COMM_SHA" \
            --expected-version "$RELEASE_VERSION" --package-format TGZ \
            --config Release --suite all --require-slcan --allow-downloads --jobs 2

      - name: Upload diagnostic evidence
        if: always() && env.RELEASE_WORK != ''
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-linux-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ env.RELEASE_WORK }}/evidence/

      - name: Upload validated Linux packages
        if: success()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-linux-tgz-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_WORK }}/packages/*/*.tar.gz
            ${{ env.RELEASE_WORK }}/packages/*/*.sha256
            ${{ env.RELEASE_WORK }}/packages/release-manifest.json

  windows:
    name: Windows x64 / MSVC / Release / ZIP
    if: github.event_name != 'push' || github.event.deleted != true
    # Requires a native Windows runner with VS 2022, v143 14.44 and Python 3.
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact hand revision
        env:
          TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -c "http.extraHeader=AUTHORIZATION: bearer $env:TOKEN" clone --no-checkout "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" hand-cpp
          if ($LASTEXITCODE -ne 0) { throw 'Hand clone failed' }
          git -C hand-cpp checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Hand checkout failed' }

      - name: Resolve tag or manual release inputs
        run: |
          python hand-cpp/validation/resolve_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release input validation failed' }

      - name: Check out exact transport revision
        env:
          COMM_TOKEN: ${{ secrets.LINKERBOT_COMM_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -c "http.extraHeader=AUTHORIZATION: bearer $env:COMM_TOKEN" clone --no-checkout "$env:GITHUB_SERVER_URL/$env:COMM_REPO.git" linkerbot-transport-cpp
          if ($LASTEXITCODE -ne 0) { throw 'Transport clone failed' }
          git -C linkerbot-transport-cpp checkout --detach $env:COMM_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Transport checkout failed' }

      - name: Install fixed CMake and record Windows tools
        run: ./hand-cpp/validation/setup_windows.ps1

      - name: Build, audit ZIP and verify relocated consumers
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = Join-Path $env:RUNNER_TEMP ('sdk-release-windows-' + [guid]::NewGuid().ToString('N'))
          "RELEASE_WORK=$Work" >> $env:GITHUB_ENV
          python hand-cpp/validation/run_release_validation.py `
            --comm-source linkerbot-transport-cpp --work-dir $Work `
            --hand-sha $env:HAND_SHA --comm-sha $env:COMM_SHA `
            --expected-version $env:RELEASE_VERSION --package-format ZIP `
            --config Release --suite all --require-slcan --allow-downloads --jobs 2 `
            --generator 'Visual Studio 17 2022' --architecture x64 --toolset 'v143,version=14.44'
          if ($LASTEXITCODE -ne 0) { throw 'Windows release acceptance failed' }

      - name: Upload diagnostic evidence
        if: always() && env.RELEASE_WORK != ''
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-windows-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ env.RELEASE_WORK }}/evidence/

      - name: Upload validated Windows packages
        if: success()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-windows-zip-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_WORK }}/packages/*/*.zip
            ${{ env.RELEASE_WORK }}/packages/*/*.sha256
            ${{ env.RELEASE_WORK }}/packages/release-manifest.json
