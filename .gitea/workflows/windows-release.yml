name: Windows release acceptance

# Native Windows runner required. Keep this manual until one is registered.
on:
  workflow_dispatch:
    inputs:
      comm_ref:
        description: 'Exact compatible comm SHA (stage B requires slcan_transport.hpp)'
        required: false
        default: '37c2e6f05ec93045e13459194b6bee7d1a2f091d'
      require_slcan:
        description: 'Fail if the paired comm has no SLCAN backend'
        type: boolean
        default: true

env:
  COMM_REPO: ouyangshun/linkerbot-transport-cpp
  COMM_REF: ${{ inputs.comm_ref || '37c2e6f05ec93045e13459194b6bee7d1a2f091d' }}
  PYTHONUTF8: '1'

jobs:
  windows:
    name: MSVC x64 / ${{ matrix.configuration }} / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        suite: [no-drivers, native-loader]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact hand and comm revisions
        env:
          TOKEN: ${{ github.token }}
          COMM_TOKEN: ${{ secrets.LINKERBOT_COMM_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -c "http.extraHeader=AUTHORIZATION: bearer $env:TOKEN" clone --no-checkout "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" hand-cpp
          if ($LASTEXITCODE -ne 0) { throw 'Hand clone failed' }
          git -C hand-cpp checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Hand checkout failed' }
          git -c "http.extraHeader=AUTHORIZATION: bearer $env:COMM_TOKEN" clone --no-checkout "$env:GITHUB_SERVER_URL/$env:COMM_REPO.git" linkerbot-transport-cpp
          if ($LASTEXITCODE -ne 0) { throw 'Comm clone failed' }
          git -C linkerbot-transport-cpp checkout --detach $env:COMM_REF
          if ($LASTEXITCODE -ne 0) { throw 'Comm checkout failed' }

      - name: Install fixed CMake and record Windows tools
        run: ./hand-cpp/validation/setup_windows.ps1

      - name: Run offline release acceptance
        run: |
          $StageB = @()
          if ('${{ inputs.require_slcan }}' -eq 'true') { $StageB += '--require-slcan' }
          python hand-cpp/validation/run_release_validation.py `
            --comm-source linkerbot-transport-cpp `
            --work-dir "$env:RUNNER_TEMP/windows-${{ matrix.configuration }}-${{ matrix.suite }}" `
            --config ${{ matrix.configuration }} --suite ${{ matrix.suite }} `
            --generator 'Visual Studio 17 2022' --architecture x64 --toolset 'v143,version=14.44' `
            --comm-sha $env:COMM_REF --hand-sha $env:GITHUB_SHA --allow-downloads @StageB
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance failed' }

      # Gitea uses the v3 artifact protocol. Do not assume a local action mirror.
      - name: Upload acceptance evidence
        if: always()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: windows-x64-${{ matrix.configuration }}-${{ matrix.suite }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/windows-${{ matrix.configuration }}-${{ matrix.suite }}/evidence/
            ${{ runner.temp }}/windows-${{ matrix.configuration }}-${{ matrix.suite }}/packages/*/*.zip
            ${{ runner.temp }}/windows-${{ matrix.configuration }}-${{ matrix.suite }}/packages/*/*.sha256
